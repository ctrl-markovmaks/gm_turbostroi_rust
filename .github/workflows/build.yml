name: Build Rust for Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib libssl-dev pkg-config

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-unknown-linux-gnu i686-unknown-linux-gnu

    - name: Run Build Script
      run: |
        # Разрешаем ошибки компилятора для некоторых старых зависимостей
        export RUSTFLAGS="--allow-unknown-lints"
        chmod +x build-linux.sh
        ./build-linux.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-binary
        path: |
          target/release/
          target/x86_64-unknown-linux-gnu/release/
          target/i686-unknown-linux-gnu/release/
        if-no-files-found: warn
